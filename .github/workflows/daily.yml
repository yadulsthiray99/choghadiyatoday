# Rebuild and deploy every night just after midnight IST, so the static pages show the new day's choghadiya.
# (Browsers also recalculate for the current date, so a late or failed run never shows wrong times.)
name: nightly-build
on:
  schedule:
    - cron: "31 18 * * *"   # 00:01 IST
  workflow_dispatch: {}
concurrency:
  group: nightly-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Build with quality gate
        run: |
          npm ci
          npm run build:gated
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if ! npx wrangler deploy 2>&1 | tee deploy.log; then
            msg=$(grep -iE "error|code: *[0-9]+|authentication|permission|not found|forbidden|zone" deploy.log | grep -v "^\s*at " | head -6 | tr '\n' ' ')
            echo "::error title=Cloudflare deploy failed::${msg:-see the step log}"
            exit 1
          fi
